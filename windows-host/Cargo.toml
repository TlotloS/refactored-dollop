[package]
name = "winext-host"
version = "0.0.1"
edition = "2021"
publish = false
description = "Windows host for the WinExt iPad screen-extender (Phase 1: mirror over WebRTC)"

[[bin]]
name = "winext-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

# WebRTC stack (pure-Rust). Heavy; we pin a known-good version.
# webrtc = "0.11"  # Uncomment when Phase 1 starts; commented to keep first-build fast.

# Windows API bindings. Phase 1 only needs DXGI + D3D11 for Desktop Duplication
# capture; Phase 2 adds IddCx (separate driver crate).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = "line-tables-only"
